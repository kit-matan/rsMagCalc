[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "rsmagcalc"
version = "0.1.0"
description = "Rust kernels (PyO3) for pyMagCalc's beyond-LSWT loops"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kittiwit Matan", email = "kittiwit@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.0"]

[tool.maturin]
# Pure-Python sources live in python/rsmagcalc; maturin adds the compiled
# extension `rsmagcalc._core` next to them.
python-source = "python"
module-name = "rsmagcalc._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
