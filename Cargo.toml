[package]
name = "rsmagcalc"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Rust kernels (PyO3) for pyMagCalc's beyond-LSWT loops"
license = "MIT"

[lib]
# The extension module is `rsmagcalc._core`; the Python package around it lives
# in python/rsmagcalc and decides whether the core is present (`backend`).
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# abi3: one wheel per platform, importable from every CPython >= 3.9. The numpy
# crate supports it (it reaches the array C API through the capsule, not the
# limited API).
pyo3 = { version = "0.30", features = ["abi3-py39"] }
numpy = "0.30"
ndarray = "0.17"
num-complex = "0.4"
rayon = "1"
rand = "0.9"
rand_pcg = "0.9"
rand_distr = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# NEVER strip (cargo's release default is strip = "debuginfo"). On macOS 27.0.1
# with Xcode 27.1 (ld-27037.1) every strip pass -- rustc's, maturin's --strip,
# and Apple's own `strip -x` -- leaves the LINKEDIT string pool at an offset
# that is 4 mod 8 whenever the indirect symbol table has an odd length, and the
# macOS 27 dyld refuses to load it ("mis-aligned LINKEDIT string pool"). The
# unstripped link is correctly padded by ld. Measured 2026-10-26; pyproject.toml
# carries the matching `strip = false` for maturin. Cost: ~0.5 MB of symbols.
strip = "none"
# No `-C target-cpu=native` here: wheels must not be tied to the build host
# (the same rule fMagCalc enforces with FMAGCALC_PORTABLE). Set RUSTFLAGS for a
# local build if you want it.
